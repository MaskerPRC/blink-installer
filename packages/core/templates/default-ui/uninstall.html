<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Uninstall</title>
  <!-- Same stylesheet as the installer, so the two look like one product. -->
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="shell">
    <header class="titlebar" id="titlebar">
      <span class="app" id="titlebar-name">Uninstall</span>
      <button class="chrome" id="btn-minimize" title="最小化" aria-label="最小化">&#8211;</button>
      <button class="chrome" id="btn-close" title="关闭" aria-label="关闭">&#10005;</button>
    </header>

    <!-- Screen 1: confirm -->
    <section class="screen is-active" data-screen="confirm">
      <div class="hero">
        <div class="logo warn" id="logo-mark"></div>
        <h1 id="confirm-title">卸载</h1>
        <p class="subtitle" id="confirm-subtitle"></p>
      </div>

      <div class="field" id="reason-field">
        <label for="reason">能告诉我们原因吗？（可选）</label>
        <select id="reason">
          <option value="">不想说</option>
          <option value="not-needed">不再需要了</option>
          <option value="bugs">遇到问题或崩溃</option>
          <option value="performance">占用资源太多</option>
          <option value="alternative">改用其他软件</option>
          <option value="reinstall">只是重新安装</option>
        </select>
      </div>

      <footer class="actions">
        <p class="agreement">卸载后将删除安装目录下的全部文件。</p>
        <button class="ghost" id="btn-cancel">取消</button>
        <button class="primary danger" id="btn-uninstall">卸载</button>
      </footer>
    </section>

    <!-- Screen 2: progress -->
    <section class="screen" data-screen="removing">
      <div class="hero">
        <div class="logo warn spinning" id="logo-removing"></div>
        <h1>正在卸载</h1>
        <p class="subtitle" id="remove-detail">准备中…</p>
      </div>
      <div class="progress">
        <div class="bar"><span id="progress-fill"></span></div>
        <div class="percent" id="progress-percent">0%</div>
      </div>
    </section>

    <!-- Screen 3: done -->
    <section class="screen" data-screen="done">
      <div class="hero">
        <div class="logo done">&#10003;</div>
        <h1>卸载完成</h1>
        <p class="subtitle" id="done-subtitle"></p>
      </div>
      <footer class="actions">
        <p class="agreement">&nbsp;</p>
        <button class="primary" id="btn-finish">完成</button>
      </footer>
    </section>
  </div>

  <script type="module" src="./uninstall.js"></script>
</body>
</html>
